name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1e3a5f&color_dots=#ebedf0,#c6d6e8,#9bb8d6,#4f7cac,#1e3a5f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7aa2c8&color_dots=#161b22,#1a2b44,#1e3a5f,#4f7cac,#7aa2c8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
